extends: existence
message: "'%s' rebuts a reading nobody offered; drop it unless a reader would actually make that mistake."
level: warning
ignorecase: true
tokens:
  - ',\s+(?:not|rather than)\s+(?:simply\s+|merely\s+|just\s+)?(?:a|an)\s+(?:claim|proof|demonstration|guarantee|description|requirement|prediction|recipe|statement|promise|rejection|endorsement)\b'
  - '\bnot\s+(?:simply|merely|necessarily)\b'
  - '\b(?:does not|doesn''t|did not|didn''t)\s+by itself\b'
