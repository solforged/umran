StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.{md,mdx}]
Voice.Concerns = YES
Voice.DisclaimerTail = YES
Voice.SemicolonDensity = YES
Voice.ShellSubject = YES
Voice.Dashes = YES

ai-tells.ConsequenceParticiple = warning
ai-tells.ContrastiveFormulas = warning
ai-tells.MicDrop = warning
ai-tells.PseudoCleft = warning
ai-tells.ShellNounCopula = warning
# The upstream rule also flags en dashes in ranges and compound names.
ai-tells.EmDashUsage = NO

# Quoted UI copy is authored prose and should be checked too.
TokenIgnores = (\[\[[^\]|]+)
BlockIgnores = (?m)^>.*$

# The interface speaks in the world's own period voice on purpose, so the
# shared house style's interface-text rules stay off here.
[*.{tsx,jsx}]
Voice.UiGuarantee = NO
Voice.UiNarration = NO
Voice.UiCadence = NO
Voice.UiLength = NO
Voice.UiSemicolon = NO
