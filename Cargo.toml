[workspace]
members = ["crates/langgen-core", "crates/langgen-sim", "crates/langgen-web"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
langgen-core = { path = "crates/langgen-core" }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

