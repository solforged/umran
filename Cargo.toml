[workspace]
members = ["crates/umran-sim", "crates/umran-web"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/solforged/umran"

[workspace.dependencies]
umran-sim = { path = "crates/umran-sim" }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
# Native parity reparses facade JSON; preserve f64 bits just like JS JSON.parse.
serde_json = { version = "1", features = ["float_roundtrip"] }


# The simulator's statistical tests run thousands of generations; optimize
# it (and its RNG) even in dev builds so `cargo test` stays fast.
[profile.dev.package.umran-sim]
opt-level = 2

[profile.dev.package.rand_chacha]
opt-level = 2
